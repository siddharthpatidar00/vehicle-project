<!-- Advertisement Section -->
<div *ngIf="ad1Image" class="w-full h-auto bg-gray-100 p-1 text-center flex shadow-lg">
    <img [src]="ad1Image" alt="Advertisement 1" class="h-full w-full object-cover cursor-pointer">
</div>




<!-- Slider Section -->
<div class="relative w-full h-[500px] overflow-hidden mb-4">

    <!-- Loading Skeleton -->
    <ng-container *ngIf="!images || images.length === 0">
        <div class="w-full h-full bg-gray-300 animate-pulse"></div>

        <!-- Navigation Arrows (Below, but on image) -->
        <div class="absolute z-20 flex justify-center gap-4 w-full bottom-4">
            <!-- Prev Button -->
            <button (click)="prevSlide()" class="bg-white/30 hover:bg-white/50 text-white p-3 rounded-full transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 stroke-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <!-- Next Button -->
            <button (click)="nextSlide()" class="bg-white/30 hover:bg-white/50 text-white p-3 rounded-full transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 stroke-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </ng-container>

    <!-- Actual Slider -->
    <ng-container *ngIf="images && images.length > 0">
        <!-- Slider Images -->
        <div class="flex transition-transform duration-700 ease-in-out h-full"
            [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">
            <img *ngFor="let img of images" [src]="img" class="w-full flex-shrink-0 object-cover h-full" alt="Slide" />
        </div>

        <!-- Dark Overlay -->
        <!-- <div class="absolute top-0 left-0 w-full h-full bg-black bg-opacity-50 z-0"></div> -->

        <!-- Navigation Arrows (Below, but on image) -->
        <div class="absolute z-20 flex justify-center gap-4 w-full bottom-4">
            <!-- Prev Button -->
            <button (click)="prevImageSlide()" class="bg-white/30 hover:bg-white/50 text-white p-3 rounded-full transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 stroke-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <!-- Next Button -->
            <button (click)="nextImageSlide()" class="bg-white/30 hover:bg-white/50 text-white p-3 rounded-full transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 stroke-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </ng-container>

</div>



<div class="relative w-full py-6 bg-gradient-to-b">
    <p class="text-2xl sm:text-3xl md:text-5xl font-bold text-center text-black">SELECT INDUSTRY</p>
    <div class="relative">
        <div #categoryWrapper class="overflow-x-auto scroll-smooth no-scrollbar px-0 h-[460px]">
            <div class="inline-flex gap-6 min-w-max mx-auto">

                <!-- Loading Skeletons -->
                <ng-container *ngIf="!categories || categories.length === 0">
                    <div *ngFor="let i of [1,2,3,4]" class="flex-none w-99">
                        <article
                            class="relative isolate flex flex-col justify-end overflow-hidden rounded-2xl px-8 py-8 max-w-sm mx-auto mt-10 animate-pulse cursor-pointer bg-gray-400">
                            <div class="absolute inset-0 bg-gray-500/50"></div>
                            <img src="assets/images/loading.jpg" alt="loading image" class="w-full h-full">
                        </article>
                    </div>
                </ng-container>

                <!-- Actual Cards -->
                <ng-container *ngIf="categories && categories.length > 0">
                    <div class="flex-none w-99" *ngFor="let category of categories" [routerLink]="'/vehicles-listing'"
                        [queryParams]="{ category_name: (category.category_name || '').trim() }">
                        <article
                            class="relative isolate flex flex-col justify-end overflow-hidden rounded-2xl px-8 pb-8 pt-40 max-w-sm mx-auto mt-24 cursor-pointer">
                            <img [src]="getCategoryImageUrl(category.category_image)" [alt]="category.category_name"
                                class="absolute inset-0 h-full w-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40"></div>
                            <p class="z-10 mt-4 text-2xl font-bold text-white">{{category.category_name | uppercase}}
                            </p>
                        </article>
                    </div>
                </ng-container>

            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 flex gap-3 mb-2">
            <button (click)="prevCategory()" class="p-3 transition transform hover:scale-110 shadow-lg">
                <img src="assets/images/previous.png" class="w-10 h-10 object-cover">
            </button>
            <button (click)="nextCategory()" class="p-3 transition transform hover:scale-110 shadow-lg">
                <img src="assets/images/next.png" class="w-10 h-10 object-cover">
            </button>
        </div>
    </div>
</div>


<div class="relative w-full py-2 bg-gradient-to-b mb-3">
    <p class="text-2xl sm:text-3xl md:text-5xl font-bold text-center text-black">Our Brands</p>
    <div class="relative">
        <div #brandWrapper class="overflow-x-auto scroll-smooth no-scrollbar px-8 h-[350px] cursor-pointer">
            <div class="inline-flex gap-6 min-w-max mx-auto">
                <!-- Loading Skeletons -->
                <ng-container *ngIf="!brands || brands.length === 0">
                    <div *ngFor="let i of [1,2,3,4]" class="flex-none w-99">
                        <article
                            class="relative isolate flex flex-col justify-end overflow-hidden rounded-2xl px-8 pb-8 pt-5 max-w-sm mx-auto animate-pulse cursor-pointer bg-gray-400">
                            <div class="absolute inset-0 bg-gray-500/50"></div>
                            <img src="assets/images/loading.jpg" alt="loading image" class="w-full h-[100px] object-cover">
                            <p
                                class="bg-black w-full py-4 rounded text-2xl font-extrabold mb-auto text-center mt-3">
                            </p>
                        </article>
                    </div>
                </ng-container>
                <div class="flex-none w-70" *ngFor="let brand of brands">
                    <div
                        class="bg-[darkorange] border border-white/20 rounded-2xl p-4 flex flex-col items-center justify-between h-60 transform transition-transform duration-300 hover:scale-105 hover:shadow-2xl relative mt-[12px]">
                        <img [src]="getBrandImageUrl(brand.brand_image)" [alt]="brand.brand_name"
                            class="max-w-fit h-32 object-contain mb-auto p-1 shadow-lg">
                        <p
                            class="text-[darkorange] bg-black w-full py-2 rounded text-2xl font-extrabold mb-auto text-center mt-3">
                            {{ brand.brand_name }}
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="absolute -bottom-0 left-1/2 transform -translate-x-1/2 flex gap-3">
            <button (click)="prevBrand()" class="p-3 transition transform hover:scale-110 shadow-lg">
                <img src="assets/images/previous.png" class="w-10 h-10 object-cover">
            </button>
            <button (click)="nextBrand()" class="p-3 transition transform hover:scale-110 shadow-lg">
                <img src="assets/images/next.png" class="w-10 h-10 object-cover">
            </button>
        </div>
    </div>
</div>


<div class="relative w-full py-6 bg-gradient-to-b">
    <p class="text-2xl sm:text-3xl md:text-5xl font-bold text-center text-black">Happy Customers</p>
    <div class="relative">
        <div #customerWrapper class="overflow-x-auto scroll-smooth no-scrollbar px-8 h-[460px] cursor-pointer">
            <div class="inline-flex gap-6 min-w-max mx-auto">
                <!-- Loading Skeletons -->
                <ng-container *ngIf="!customers || customers.length === 0">
                    <div class="flex justify-center gap-6">
                        <div *ngFor="let i of [1,2,3,4]" class="flex-none w-99">
                            <article
                                class="relative isolate flex flex-col justify-end overflow-hidden rounded-2xl px-8 pb-8 pt-40 max-w-sm mt-10 mx-auto animate-pulse cursor-pointer bg-gray-400">
                                <div class="absolute inset-0 bg-gray-500/50"></div>
                                <div class="relative flex animate-pulse gap-2 p-0">
                                    <div class="h-12 w-12 rounded-full bg-slate-400"></div>
                                    <div class="flex-1">
                                        <div class="mb-1 h-5 w-3/5 rounded-lg bg-slate-400 text-lg"></div>
                                        <div class="h-5 w-[90%] rounded-lg bg-slate-400 text-sm"></div>
                                    </div>
                                    <div class="absolute bottom-5 right-0 h-4 w-4 rounded-full bg-slate-400"></div>
                                </div>
                            </article>
                        </div>
                    </div>
                </ng-container>

                <div class="flex-none w-70" *ngFor="let customer of customers">
                    <div
                        class="bg-[darkorange] border border-white/20 rounded-2xl p-4 flex flex-col items-center justify-between h-80 transform transition-transform duration-300 hover:scale-105 hover:shadow-2xl relative mt-[12px]">
                        <img [src]="customer.image" alt="{{ customer.name }}"
                            class="w-32 h-32 object-cover rounded-full mb-6 border-2 border-white p-1 shadow-lg">
                        <h2 class="text-white text-xl font-bold mb-2 text-center">{{ customer.name }}</h2>
                        <p class="text-gray-200 text-sm text-center" [innerHTML]="customer.message | splitAfterWords:5">
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 flex gap-3 mb-2">
            <button (click)="prevSlide()" class="p-3 transition transform hover:scale-110 shadow-lg">
                <img src="assets/images/previous.png" class="w-10 h-10 object-cover">
            </button>
            <button (click)="nextSlide()" class="p-3 transition transform hover:scale-110 shadow-lg">
                <img src="assets/images/next.png" class="w-10 h-10 object-cover">
            </button>
        </div>
    </div>
</div>
