<!-- Toggle Button (Mobile only) -->
<button class="md:hidden flex items-center gap-2 bg-black text-[#fcb026] px-4 py-2 rounded mb-3"
    (click)="toggleSidebar()">
    <i class="cil-filter"></i> Filter
</button>

<!-- Sidebar Container (Mobile: show only if open) -->
<div *ngIf="isSidebarOpen || !isMobile" class="w-full md:w-75 rounded-lg shadow p-4 flex flex-col self-start
         transition-all duration-700 ease-in-out overflow-hidden"
    style=" background: linear-gradient(to bottom, #fcb026 0%, #fee1a1 50%), linear-gradient(to bottom, #fee1a1 50%, #fff5d6 100%); ">


    <!-- Brand Dropdown -->
    <div class="relative dropdown-wrapper">
        <label class="block text-sm font-semibold text-black mb-1">Brand</label>
        <button type="button" (click)="toggleBrandDropdown($event)"
            class="w-full px-3 py-2 border border-gray-300 rounded text-left bg-white flex justify-between items-center">
            {{ selectedBrand || 'Select option' }}
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
        <ul *ngIf="brandDropdownOpen"
            class="absolute left-0 mt-1 w-full bg-white border border-gray-300 rounded shadow-lg max-h-60 overflow-y-auto z-50">
            <li *ngFor="let brand of brands" (click)="selectBrand(brand.name, $event)"
                class="px-3 py-2 cursor-pointer hover:bg-gray-100 whitespace-nowrap ml-[-30px]">
                {{ brand.name }}
            </li>
        </ul>
    </div>

    <!-- Category Dropdown -->
    <div class="relative dropdown-wrapper mt-4">
        <label class="block text-sm font-semibold text-black mb-1">Category</label>
        <button type="button" (click)="toggleCategoryDropdown($event)"
            class="w-full px-3 py-2 border border-gray-300 rounded text-left bg-white flex justify-between items-center">
            {{ selectedCategory || 'Select option' }}
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
        <ul *ngIf="categoryDropdownOpen"
            class="absolute left-0 mt-1 w-full bg-white border border-gray-300 rounded shadow-lg max-h-60 overflow-y-auto z-50">
            <li *ngFor="let category of categories" (click)="selectCategory(category.name, $event)"
                class="px-3 py-2 cursor-pointer hover:bg-gray-100 whitespace-nowrap ml-[-30px]">
                {{ category.name }}
            </li>
        </ul>
    </div>



    <!-- Price Range -->
    <div class="relative w-full mb-3">
        <p class="text-sm text-gray-700">Price</p>
        <input type="range" [(ngModel)]="minValue" [min]="priceRange.minOriginal || 500000"
            [max]="priceRange.maxOriginal || 10000000" step="50000"
            class="absolute w-full pointer-events-none appearance-none"
            [style.zIndex]="minValue > maxValue - 50000 ? 5 : 3" />

        <input type="range" [(ngModel)]="maxValue" [min]="priceRange.minOriginal || 500000"
            [max]="priceRange.maxOriginal || 10000000" step="50000" class="absolute w-full" />

        <div class="mt-12 flex justify-between text-sm text-gray-700">
            <span>Min: ₹{{ minValue | number }}</span>
            <span>Max: ₹{{ maxValue | number }}</span>
        </div>
    </div>

    <!-- Year of Manufacture -->
    <label class="block mb-3">
        <span class="text-sm text-gray-700">Year of manufacture</span>
        <select class="mt-1 block w-full rounded border border-black p-2">
            <option value="">Select Year</option>
        </select>
    </label>

    <!-- Apply Filter Button -->
    <button (click)="applyFilter()" class="w-full bg-black hover:bg-red-800 text-[#fcb026] font-[600] py-2 rounded">
        Apply Filters
    </button>
</div>
